[project]
name = "quantumshield"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arjun Kamath", email = "arjun.kamath24@st.niituniversity.in" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "liboqs-python==0.16.0.2",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "qiskit>=2.6.2",
    "qiskit-aer>=0.18.2",
    "streamlit>=1.67.0",
]

[project.scripts]
quantumshield = "quantumshield:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
