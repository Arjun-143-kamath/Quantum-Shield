
services:
  quantumshield:
    build:
      context: .
      dockerfile: Dockerfile

    image: quantumshield:latest

    container_name: quantumshield

    restart: unless-stopped

    ports:
      - "127.0.0.1:8501:8501"

    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    volumes:
      # Persistent users, private keys, transfers and SQLite database.
      - quantumshield_data:/app/data

      # Persistent benchmark experiment reports.
      - quantumshield_results:/app/research/results

    init: true

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s


volumes:
  quantumshield_data:
    name: quantumshield_data

  quantumshield_results:
    name: quantumshield_results

